<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="140" cy="90" r="1" opacity="0.6"/>
    <circle cx="220" cy="30" r="1.4" opacity="0.9"/>
    <circle cx="320" cy="70" r="1" opacity="0.5"/>
    <circle cx="90" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="980" cy="50" r="1.3" opacity="0.8"/>
    <circle cx="1050" cy="120" r="1" opacity="0.6"/>
    <circle cx="1120" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="1150" cy="200" r="1" opacity="0.5"/>
    <circle cx="1000" cy="240" r="1.2" opacity="0.7"/>
    <circle cx="700" cy="30" r="1" opacity="0.6"/>
    <circle cx="500" cy="260" r="1" opacity="0.5"/>
    <circle cx="180" cy="250" r="1.1" opacity="0.6"/>
    <circle cx="850" cy="270" r="1.1" opacity="0.6"/>
    <circle cx="400" cy="40" r="1" opacity="0.5"/>
  </g>

  <!-- faint horizon line -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#ff3b3b" stroke-opacity="0.25" stroke-width="1"/>

  <!-- glow behind disc -->
  <circle cx="600" cy="150" r="140" fill="url(#glow)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.25">
    <circle cx="600" cy="150" r="95">
      <animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="150" r="115" stroke-opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="360 600 150" to="0 600 150" dur="26s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting node -->
  <g>
    <circle r="4" fill="#ff6a3d">
      <animateMotion dur="18s" repeatCount="indefinite"
        path="M 695,150 A 95,95 0 1,1 505,150 A 95,95 0 1,1 695,150"/>
    </circle>
  </g>

  <!-- central disc / eclipse -->
  <circle cx="600" cy="150" r="60" fill="url(#disc)" stroke="#ff6a3d" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- name -->
  <text x="600" y="230" text-anchor="middle" font-family="monospace" font-size="30" fill="#ffffff" letter-spacing="2">
    HARSHIT SHARMA
  </text>
  <text x="600" y="255" text-anchor="middle" font-family="monospace" font-size="14" fill="#9aa4b2" letter-spacing="1">
    B.Tech CSE Student · C/C++ · Python · DSA · Backend Development
  </text>
</svg>
